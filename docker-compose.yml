services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    user: root
    working_dir: /home/dynamodblocal
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/create-tables.sh:/create-tables.sh:ro
    entrypoint: [ "sh", "/create-tables.sh" ]

  app:
    build: .
    container_name: mini-ecommerce-app
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      APP_DYNAMODB_REGION: us-east-1
    ports:
      - "8080:8080"

volumes:
  dynamodb-data: